name: Build UndOpti

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore bi.sln -p:Platform=x64

      - name: Build solution
        run: dotnet build bi.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish UndOpti
        run: >
          dotnet publish src/RustPerformanceSuite/RustPerformanceSuite.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/UndOpti

      - name: Build Keygen
        run: >
          dotnet publish tools/UndOptiKeygen/UndOptiKeygen.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/UndOptiKeygen

      - name: Upload UndOpti
        uses: actions/upload-artifact@v4
        with:
          name: UndOpti
          path: artifacts/UndOpti/

      - name: Upload UndOpti Keygen
        uses: actions/upload-artifact@v4
        with:
          name: UndOptiKeygen
          path: artifacts/UndOptiKeygen/
