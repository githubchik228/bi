name: Build UndOpti

on:
  push:
    branches:
      - main
      - undopti/full-optimizer
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/RustPerformanceSuite/RustPerformanceSuite.csproj -p:Platform=x64

      - name: Build
        run: dotnet build src/RustPerformanceSuite/RustPerformanceSuite.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish UndOpti
        run: >
          dotnet publish src/RustPerformanceSuite/RustPerformanceSuite.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/UndOpti

      - name: Upload UndOpti
        uses: actions/upload-artifact@v4
        with:
          name: UndOpti
          path: artifacts/UndOpti/
